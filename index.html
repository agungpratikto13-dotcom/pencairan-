margin-bottom:35px;

    margin:0;

    color:#64748b;

.icon{

.icon img{
    width:180px;

llabel{
    color:#e2e8f0;

input{
    width:100%;
    padding:12px 15px;

    background:#1f2937;
    color:#f8fafc;

    border:1px solid #374151;
    border-radius:10px;

    outline:none;
}

input:focus{
    border-color:#3b82f6;
    box-shadow:0 0 10px rgba(59,130,246,.3);
}

table{
    width:100%;

    border-collapse:collapse;
    background:#111827;

/* efek kilau tabel */

table::after{

content:"";

position:absolute;

top:0;

left:-120%;

width:70%;

height:100%;


background:
linear-gradient(
120deg,
transparent,
rgba(255,255,255,.55),
transparent
);


transform:skewX(-25deg);

animation:kilau 5s infinite;

pointer-events:none;

}


@keyframes kilau{

0%{

left:-120%;

}

}



th{
    background:#1e3a8a;
    color:#fff;
    padding:15px;

}


td{
    background:#1f2937;
    color:#f8fafc;
    padding:12px;

    border:1px solid #374151;
}


tbody tr:hover td{
    background:#374151;
}


th{

background:rgba(255,255,255,.25);

color:#000;

padding:15px;

font-size:16px;

font-weight:800;

border-radius:12px;

border:1px solid rgba(0,0,0,.15);

box-shadow:
0 5px 15px rgba(0,0,0,.10);

}


td{

padding:12px;

text-align:center;

background:rgba(255,255,255,.15);

color:#111;

border-radius:12px;

border:1px solid rgba(0,0,0,.12);

box-shadow:
inset 0 0 10px rgba(255,255,255,.2);

}


tbody tr:hover td{

background:rgba(255,255,255,.35);

transform:scale(1.01);

}

th{

background:rgba(255,255,255,.25);

color:#000;

padding:15px;

font-size:16px;

font-weight:800;

border-radius:12px;

border:1px solid rgba(0,0,0,.15);

box-shadow:
0 5px 15px rgba(0,0,0,.10);

}

td{

padding:12px;

text-align:center;

background:rgba(255,255,255,.15);

color:#111;

border-radius:12px;

border:1px solid rgba(0,0,0,.12);

box-shadow:
inset 0 0 10px rgba(255,255,255,.2);

}

 td:first-child{

color:#000;

font-weight:700;

}
    
tbody tr{

    transition:.25s;

}

tr:nth-child(even){

    background:rgba(255,255,255,.05);

}

tbody tr:hover td{

background:rgba(255,255,255,.35);

transform:scale(1.01);

}

    background:rgba(255,255,255,.05);

}

button{

    padding:13px 25px;

    border:none;

    border-radius:12px;

    color:white;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

    margin-top:20px;

    margin-right:10px;

}

button:hover{

    transform:translateY(-3px);

    box-shadow:0 10px 20px rgba(0,0,0,.2);

}

.btn-convert{

    background:#2563eb;

}

.btn-copy{

    background:#7c3aed;

}

.btn-reset{

    background:#dc2626;

}

textarea{
    width:100%;
    min-height:320px;
    margin-top:20px;

    background:#030712;
    color:#22d3ee;

    border:1px solid #374151;
    border-radius:15px;

    padding:20px;

    font-family:"JetBrains Mono",monospace;
}

    .container{

    animation:muncul .5s ease;

}

@keyframes muncul{

    from{

        opacity:0;
        transform:translateY(30px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

}
    
footer{

    text-align:center;

    margin-top:25px;

    color:#64748b;

</head>

<body>

<div class="container">

<div class="header-app">

 <div class="icon">
    <img src="logo.png" alt="Mini Toto">
</div>

    <div>
        <h2>LAPORAN PENCAIRAN</h2>
        <p>Sistem Monitoring Pencairan</p>
    </div>

</div>

Tanggal :
<input id="tanggal">

<br><br>

Nama :
<input id="nama" value="PAYDIA PRN MINITOTO">


<table>

<tr>
<th>Keterangan</th>
<th>Batch 1</th>
<th>Batch 2</th>
<th>Batch 3</th>
<th>Batch 4</th>
</tr>


<tr>
<td>Nilai Depo</td>

<td><input id="d1"></td>
<td><input id="d2"></td>
<td><input id="d3"></td>
<td><input id="d4"></td>

</tr>


<tr>
<td>Total Cair</td>

<td><input id="c1"></td>
<td><input id="c2"></td>
<td><input id="c3"></td>
<td><input id="c4"></td>

</tr>


<tr>
<td>Ketampung</td>

<td><input id="k1"></td>
<td><input id="k2"></td>
<td><input id="k3"></td>
<td><input id="k4"></td>

</tr>


<tr>
<td>Biaya Transfer</td>

<td><input id="t1"></td>
<td><input id="t2"></td>
<td><input id="t3"></td>
<td><input id="t4"></td>

</tr>


</table>


<button class="btn-convert" onclick="convert()">Convert Laporan</button>

<button class="btn-copy" onclick="copyLaporan()">Copy</button>

<button class="btn-reset" onclick="resetData()">Reset</button>


<textarea id="hasil"></textarea>
    
<footer>
    By Agung
</footer>

</div>
    
<script>

function angka(id){

    let nilai = document.getElementById(id).value;

    nilai = nilai.replace(/,/g,'');

    return Number(nilai) || 0;

}


function formatAngka(angka){

    return angka.toLocaleString("en-US");

}



function convert(){

    let tanggal = document.getElementById("tanggal").value;
    let nama = document.getElementById("nama").value;


    // BATCH 1
    let d1 = angka("d1");
    let c1 = angka("c1");
    let k1 = angka("k1");
    let t1 = angka("t1");


    // BATCH 2
    let d2 = angka("d2");
    let c2 = angka("c2");
    let k2 = angka("k2");
    let t2 = angka("t2");


    // BATCH 3
    let d3 = angka("d3");
    let c3 = angka("c3");
    let k3 = angka("k3");
    let t3 = angka("t3");


    // BATCH 4
    let d4 = angka("d4");
    let c4 = angka("c4");
    let k4 = angka("k4");
    let t4 = angka("t4");



    // TOTAL

    let totalDepo =
        d1+d2+d3+d4;

    let totalCair =
        c1+c2+c3+c4;

    let totalKet =
        k1+k2+k3+k4;

    let totalTransfer =
        t1+t2+t3+t4;



let laporan = 
`BERIKUT LAPORAN PENCAIRAN ${nama} ${tanggal}

`;


if(d1 || c1 || k1 || t1){

laporan +=
`(PENCAIRAN BATCH 1)

NILAI DEPO : ${formatAngka(d1)}
TOTAL CAIR : ${formatAngka(c1)}
KETAMPUNG : ${formatAngka(k1)}
BIAYA TRANSFER : ${formatAngka(t1)}

`;

}


if(d2 || c2 || k2 || t2){

laporan +=
`(PENCAIRAN BATCH 2)

NILAI DEPO : ${formatAngka(d2)}
TOTAL CAIR : ${formatAngka(c2)}
KETAMPUNG : ${formatAngka(k2)}
BIAYA TRANSFER : ${formatAngka(t2)}

`;

}


if(d3 || c3 || k3 || t3){

laporan +=
`(PENCAIRAN BATCH 3)

NILAI DEPO : ${formatAngka(d3)}
TOTAL CAIR : ${formatAngka(c3)}
KETAMPUNG : ${formatAngka(k3)}
BIAYA TRANSFER : ${formatAngka(t3)}

`;

}


if(d4 || c4 || k4 || t4){

laporan +=
`(PENCAIRAN BATCH 4)

NILAI DEPO : ${formatAngka(d4)}
TOTAL CAIR : ${formatAngka(c4)}
KETAMPUNG : ${formatAngka(k4)}
BIAYA TRANSFER : ${formatAngka(t4)}

`;

}


let jumlahBatch = 0;

if(d1 || c1 || k1 || t1) jumlahBatch++;
if(d2 || c2 || k2 || t2) jumlahBatch++;
if(d3 || c3 || k3 || t3) jumlahBatch++;
if(d4 || c4 || k4 || t4) jumlahBatch++;


if(jumlahBatch > 1){

laporan +=
`
======================================

TOTAL KESELURUHAN PENCAIRAN ${tanggal}

TOTAL NILAI DEPO : ${formatAngka(totalDepo)}
TOTAL CAIR : ${formatAngka(totalCair)}
TOTAL KETAMPUNG : ${formatAngka(totalKet)}
TOTAL BIAYA TRANSFER : ${formatAngka(totalTransfer)}

BERIKUT TOTAL KESELURUHAN PENCAIRAN HARI INI YA BANG`;

}

if(jumlahBatch == 0){

alert("Silahkan isi minimal 1 Batch terlebih dahulu");
return;

}
    
   // tampilkan hasil
document.getElementById("hasil").value = laporan;

}
    
function copyLaporan(){

    let teks = document.getElementById("hasil");

    teks.select();

    navigator.clipboard.writeText(teks.value);

    alert("Laporan berhasil di-copy");

}

function resetData(){

    document.querySelectorAll("input").forEach(function(i){

        i.value="";

    });


    document.getElementById("hasil").value="";

}

// FORMAT INPUT OTOMATIS DENGAN KOMA

document.querySelectorAll("input").forEach(function(input){

    input.addEventListener("input", function(){

        if(this.id=="tanggal" || this.id=="nama"){
            return;
        }


        let posisi = this.selectionStart;

        let angka = this.value.replace(/,/g,'');


        if(!isNaN(angka) && angka!=""){

            this.value = Number(angka).toLocaleString("en-US");

        }


        this.setSelectionRange(posisi,posisi);

    });

});

 function tanggalHariIni(){

    let hari = new Date();

    let tanggal = hari.getDate();

    let bulan = [
        "JANUARI",
        "FEBRUARI",
        "MARET",
        "APRIL",
        "MEI",
        "JUNI",
        "JULI",
        "AGUSTUS",
        "SEPTEMBER",
        "OKTOBER",
        "NOVEMBER",
        "DESEMBER"
    ];

    let namaBulan = bulan[hari.getMonth()];

    let tahun = hari.getFullYear();


    document.getElementById("tanggal").value =
    tanggal + " " + namaBulan + " " + tahun;

}


window.onload = function(){

    tanggalHariIni();

}

</script>

</body>

</html>
