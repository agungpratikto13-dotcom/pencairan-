table{

th{

td{

padding:12px;

text-align:center;

background:transparent;

border:1px solid rgba(255,255,255,.15);

    tbody tr{

}

tbody tr:hover{

background:rgba(255,255,255,.08);

}

    background:rgba(255,255,255,.05);

}

button{

    padding:13px 25px;

    border:none;

    border-radius:12px;

    color:white;

    font-size:15px;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    transform:translateY(-3px);

}

.btn-convert{

.btn-copy{

}

.btn-reset{

    background:#dc2626;

}

.btn-lihat{

    background:#16a34a;

}
    .btn-muat{

    background:#0891b2;

}
textarea{

background:#0b1120;

color:#67e8f9;

font-family:

"JetBrains Mono",monospace;

font-size:14px;

line-height:1.7;

border-radius:18px;

padding:20px;

box-shadow:

inset 0 0 20px rgba(0,0,0,.4);

}

.history-card{

background:white;

padding:18px;

border-radius:18px;

margin-top:15px;

border:none;

box-shadow:

0 10px 25px rgba(0,0,0,.08);

transition:.25s;

}

transform:

translateY(-3px);

}

    .container{

    animation:muncul .5s ease;

}

@keyframes muncul{

    from{

        opacity:0;
        transform:translateY(30px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

footer{

    text-align:center;

    margin-top:25px;

    color:#64748b;

    font-size:14px;

}

</head>

<body>

<div class="container">

<div class="header-app">

 <div class="icon">
    <img src="logo.png" alt="Mini Toto">
</div>

    <div>
        <h2>LAPORAN PENCAIRAN</h2>
        <p>Sistem Monitoring Pencairan</p>
    </div>

</div>

Tanggal :
<input id="tanggal" value="31 JULI 2026">

<br><br>

Nama :
<input id="nama" value="PAYDIA PRN MINITOTO">


<table>

<tr>
<th>Keterangan</th>
<th>Batch 1</th>
<th>Batch 2</th>
<th>Batch 3</th>
<th>Batch 4</th>
</tr>


<tr>
<td>Nilai Depo</td>

<td><input id="d1"></td>
<td><input id="d2"></td>
<td><input id="d3"></td>
<td><input id="d4"></td>

</tr>


<tr>
<td>Total Cair</td>

<td><input id="c1"></td>
<td><input id="c2"></td>
<td><input id="c3"></td>
<td><input id="c4"></td>

</tr>


<tr>
<td>Ketampung</td>

<td><input id="k1"></td>
<td><input id="k2"></td>
<td><input id="k3"></td>

</tr>

<td>Biaya Transfer</td>

<td><input id="t1"></td>

</tr>


</table>


<button class="btn-convert" onclick="convert()">Convert Laporan</button>

<button class="btn-copy" onclick="copyLaporan()">Copy</button>

<button class="btn-reset" onclick="resetData()">Reset</button>


<textarea id="hasil"></textarea>

<h3>Riwayat Laporan</h3>

<div id="riwayat"></div>
    
<footer>
    By Agung
</footer>

</div>
    
<script>


let total=0;

document.querySelectorAll("."+kelas).forEach(function(i){

let angka=i.value.replace(/,/g,"");

total+=Number(angka)||0;

});

return total;

}

function format(x){
    return x.toLocaleString("en-US");
}


document.getElementById("totalDepo").innerHTML=format(jumlah("depo"));
document.getElementById("totalCair").innerHTML=format(jumlah("cair"));

document.getElementById("totalTF").innerHTML=format(jumlah("tf"));

<script>

  
function angka(id){

    let nilai = document.getElementById(id).value;

    nilai = nilai.replace(/,/g,'');

    return Number(nilai) || 0;

}


function formatAngka(angka){

    return angka.toLocaleString("en-US");

}



function convert(){

    let tanggal = document.getElementById("tanggal").value;
    let nama = document.getElementById("nama").value;


    // BATCH 1
    let d1 = angka("d1");
    let c1 = angka("c1");
    let k1 = angka("k1");
    let t1 = angka("t1");


    // BATCH 2
    let d2 = angka("d2");
    let c2 = angka("c2");
    let k2 = angka("k2");
    let t2 = angka("t2");


    // BATCH 3
    let d3 = angka("d3");
    let c3 = angka("c3");
    let k3 = angka("k3");
    let t3 = angka("t3");


    // BATCH 4
    let d4 = angka("d4");
    let c4 = angka("c4");
    let k4 = angka("k4");
    let t4 = angka("t4");



    // TOTAL

    let totalDepo =
        d1+d2+d3+d4;

    let totalCair =
        c1+c2+c3+c4;

    let totalKet =
        k1+k2+k3+k4;

    let totalTransfer =
        t1+t2+t3+t4;



let laporan =

`BERIKUT LAPORAN PENCAIRAN ${nama} ${tanggal}

(PENCAIRAN BATCH 1)
NILAI DEPO : ${formatAngka(d1)}
TOTAL CAIR : ${formatAngka(c1)}
KETAMPUNG : ${formatAngka(k1)}
BIAYA TRANSFER : ${formatAngka(t1)}

(PENCAIRAN BATCH 2)
NILAI DEPO : ${formatAngka(d2)}
TOTAL CAIR : ${formatAngka(c2)}
KETAMPUNG : ${formatAngka(k2)}
BIAYA TRANSFER : ${formatAngka(t2)}

(PENCAIRAN BATCH 3)
NILAI DEPO : ${formatAngka(d3)}
TOTAL CAIR : ${formatAngka(c3)}
KETAMPUNG : ${formatAngka(k3)}
BIAYA TRANSFER : ${formatAngka(t3)}

(PENCAIRAN BATCH 4)
NILAI DEPO : ${formatAngka(d4)}
TOTAL CAIR : ${formatAngka(c4)}
KETAMPUNG : ${formatAngka(k4)}
BIAYA TRANSFER : ${formatAngka(t4)}

======================================

TOTAL KESELURUHAN PENCAIRAN ${tanggal}

TOTAL NILAI DEPO : ${formatAngka(totalDepo)}
TOTAL CAIR : ${formatAngka(totalCair)}
TOTAL KETAMPUNG : ${formatAngka(totalKet)}
TOTAL BIAYA TRANSFER : ${formatAngka(totalTransfer)}

BERIKUT TOTAL KESELURUHAN PENCAIRAN HARI INI YA BANG`;


// tampilkan hasil
document.getElementById("hasil").value = laporan;


// simpan riwayat
simpanRiwayat(laporan,{
    nama:nama,
    tanggal:tanggal,

    d1,d2,d3,d4,
    c1,c2,c3,c4,
    k1,k2,k3,k4,
    t1,t2,t3,t4
});

}

function simpanRiwayat(laporan,dataInput){

    let data = JSON.parse(localStorage.getItem("riwayat")) || [];

   data.unshift({

    waktu:new Date().toLocaleString("id-ID"),

    nama:dataInput.nama,

    isi:laporan,

    data:dataInput

});


    localStorage.setItem(
        "riwayat",
        JSON.stringify(data)
    );


    tampilRiwayat();

}


function tampilRiwayat(){

    let data = [];

try{

    data = JSON.parse(localStorage.getItem("riwayat")) || [];

}catch(e){

    console.log("Data riwayat rusak, reset");

    localStorage.removeItem("riwayat");

}

    let html="";


    data.forEach(function(item,index){

        html += `

        <div class="history-card">

        <b>${item.waktu}</b><br>

        ${item.nama}

        <br><br>

       <button class="btn-lihat" onclick="lihatRiwayat(${index})">
        Lihat
        </button>

        <button class="btn-muat" onclick="muatRiwayat(${index})">
         Muat Data
        </button>

        <button class="btn-reset" onclick="hapusRiwayat(${index})">
        Hapus
        </button>


        </div>

        `;

    });


    document.getElementById("riwayat").innerHTML=html;

}
    
function copyLaporan(){

    let teks = document.getElementById("hasil");

    teks.select();

    navigator.clipboard.writeText(teks.value);

    alert("Laporan berhasil di-copy");

}
function lihatRiwayat(index){

    let data = JSON.parse(localStorage.getItem("riwayat"));

    document.getElementById("hasil").value = data[index].isi;

}

function muatRiwayat(index){

    let data = JSON.parse(localStorage.getItem("riwayat"));

    let item = data[index];

    let d = item.data;


    document.getElementById("nama").value = d.nama;
    document.getElementById("tanggal").value = d.tanggal;


    document.getElementById("d1").value = formatAngka(d.d1);
    document.getElementById("d2").value = formatAngka(d.d2);
    document.getElementById("d3").value = formatAngka(d.d3);
    document.getElementById("d4").value = formatAngka(d.d4);


    document.getElementById("c1").value = formatAngka(d.c1);
    document.getElementById("c2").value = formatAngka(d.c2);
    document.getElementById("c3").value = formatAngka(d.c3);
    document.getElementById("c4").value = formatAngka(d.c4);


    document.getElementById("k1").value = formatAngka(d.k1);
    document.getElementById("k2").value = formatAngka(d.k2);
    document.getElementById("k3").value = formatAngka(d.k3);
    document.getElementById("k4").value = formatAngka(d.k4);


    document.getElementById("t1").value = formatAngka(d.t1);
    document.getElementById("t2").value = formatAngka(d.t2);
    document.getElementById("t3").value = formatAngka(d.t3);
    document.getElementById("t4").value = formatAngka(d.t4);


    document.getElementById("hasil").value = item.isi;


    alert("Data laporan berhasil dimuat kembali");

}
    
function hapusRiwayat(index){

    let data =
    JSON.parse(localStorage.getItem("riwayat")) || [];


    data.splice(index,1);


    localStorage.setItem(
        "riwayat",
        JSON.stringify(data)
    );


    tampilRiwayat();

}


function resetData(){

    document.querySelectorAll("input").forEach(function(i){

        i.value="";

    });


    document.getElementById("hasil").value="";

}

// FORMAT INPUT OTOMATIS DENGAN KOMA

document.querySelectorAll("input").forEach(function(input){

    input.addEventListener("input", function(){

        if(this.id=="tanggal" || this.id=="nama"){
            return;
        }


        let posisi = this.selectionStart;

        let angka = this.value.replace(/,/g,'');


        if(!isNaN(angka) && angka!=""){

            this.value = Number(angka).toLocaleString("en-US");

        }


        this.setSelectionRange(posisi,posisi);

    });

});

  window.onload = function(){

    console.log(
        localStorage.getItem("riwayat")
    );

    tampilRiwayat();

}

</script>

</body>

</html>
