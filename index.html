<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Laporan Pencairan</title>

<style>
body{
    font-family:Arial;
    margin:30px;
    background:#f5f5f5;
}

table{
    border-collapse:collapse;
    width:100%;
    background:white;
}

th,td{
    border:1px solid #000;
    padding:8px;
    text-align:center;
}

th{
    background:#2c7be5;
    color:white;
}

input{
    width:100%;
    border:none;
    text-align:center;
    font-size:15px;
}

input:focus{
    outline:none;
    background:#ffffcc;
}
</style>

</head>

<body>

<h2 align="center">LAPORAN PENCAIRAN</h2>

<table>

<tr>
<th>Keterangan</th>
<th>Batch 1</th>
<th>Batch 2</th>
<th>Batch 3</th>
<th>Batch 4</th>
<th>Total</th>
</tr>

<tr>
<td>Nilai Depo</td>
<td><input type="number" id="d1" onkeyup="hitung()"></td>
<td><input type="number" id="d2" onkeyup="hitung()"></td>
<td><input type="number" id="d3" onkeyup="hitung()"></td>
<td><input type="number" id="d4" onkeyup="hitung()"></td>
<td id="totalDepo">0</td>
</tr>

<tr>
<td>Total Cair</td>
<td><input type="number" id="c1" onkeyup="hitung()"></td>
<td><input type="number" id="c2" onkeyup="hitung()"></td>
<td><input type="number" id="c3" onkeyup="hitung()"></td>
<td><input type="number" id="c4" onkeyup="hitung()"></td>
<td id="totalCair">0</td>
</tr>

<tr>
<td>Ketampung</td>
<td><input type="number" id="k1" onkeyup="hitung()"></td>
<td><input type="number" id="k2" onkeyup="hitung()"></td>
<td><input type="number" id="k3" onkeyup="hitung()"></td>
<td><input type="number" id="k4" onkeyup="hitung()"></td>
<td id="totalKetampung">0</td>
</tr>

<tr>
<td>Biaya Transfer</td>
<td><input type="number" id="t1" onkeyup="hitung()"></td>
<td><input type="number" id="t2" onkeyup="hitung()"></td>
<td><input type="number" id="t3" onkeyup="hitung()"></td>
<td><input type="number" id="t4" onkeyup="hitung()"></td>
<td id="totalTransfer">0</td>
</tr>

</table>

<script>

function angka(id){
    return Number(document.getElementById(id).value)||0;
}

function hitung(){

document.getElementById("totalDepo").innerHTML =
angka("d1")+angka("d2")+angka("d3")+angka("d4");

document.getElementById("totalCair").innerHTML =
angka("c1")+angka("c2")+angka("c3")+angka("c4");

document.getElementById("totalKetampung").innerHTML =
angka("k1")+angka("k2")+angka("k3")+angka("k4");

document.getElementById("totalTransfer").innerHTML =
angka("t1")+angka("t2")+angka("t3")+angka("t4");

}

</script>

</body>
</html>
