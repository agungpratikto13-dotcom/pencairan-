<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Laporan Pencairan</title>

<style>
body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#f4f6f9;
    margin:30px;
}

.container{
    max-width:1200px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#0d6efd;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#0d6efd;
    color:white;
    padding:12px;
}

td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

input{
    width:100%;
    border:none;
    text-align:right;
    font-size:15px;
    padding:5px;
}

input:focus{
    background:#fff8c4;
    outline:none;
}

.total{
    background:#fff3cd;
    font-weight:bold;
}

button{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:15px;
}

.save{
    background:#198754;
    color:white;
}

.print{
    background:#0d6efd;
    color:white;
}

</style>
</head>

<body>

<div class="container">

<h2>LAPORAN PENCAIRAN</h2>

<table>

<tr>
<th>Keterangan</th>
<th>Batch 1</th>
<th>Batch 2</th>
<th>Batch 3</th>
<th>Batch 4</th>
<th>Total</th>
</tr>

<tr>
<td>Nilai Depo</td>

<td><input class="depo" oninput="hitung()"></td>
<td><input class="depo" oninput="hitung()"></td>
<td><input class="depo" oninput="hitung()"></td>
<td><input class="depo" oninput="hitung()"></td>

<td class="total" id="totalDepo">0</td>

</tr>

<tr>

<td>Total Cair</td>

<td><input class="cair" oninput="hitung()"></td>
<td><input class="cair" oninput="hitung()"></td>
<td><input class="cair" oninput="hitung()"></td>
<td><input class="cair" oninput="hitung()"></td>

<td class="total" id="totalCair">0</td>

</tr>

<tr>

<td>Ketampung</td>

<td><input class="ket" oninput="hitung()"></td>
<td><input class="ket" oninput="hitung()"></td>
<td><input class="ket" oninput="hitung()"></td>
<td><input class="ket" oninput="hitung()"></td>

<td class="total" id="totalKet">0</td>

</tr>

<tr>

<td>Biaya Transfer</td>

<td><input class="tf" oninput="hitung()"></td>
<td><input class="tf" oninput="hitung()"></td>
<td><input class="tf" oninput="hitung()"></td>
<td><input class="tf" oninput="hitung()"></td>

<td class="total" id="totalTF">0</td>

</tr>

</table>

<br>

<button class="save" onclick="simpan()">💾 Simpan</button>
<button class="print" onclick="window.print()">🖨 Cetak</button>

</div>

<script>

function jumlah(kelas){

let total=0;

document.querySelectorAll("."+kelas).forEach(function(i){

let angka=i.value.replace(/,/g,"");

total+=Number(angka)||0;

});

return total;

}

function format(x){
    return x.toLocaleString("en-US");
}

function hitung(){

document.getElementById("totalDepo").innerHTML=format(jumlah("depo"));
document.getElementById("totalCair").innerHTML=format(jumlah("cair"));
document.getElementById("totalKet").innerHTML=format(jumlah("ket"));
document.getElementById("totalTF").innerHTML=format(jumlah("tf"));

}

function simpan(){

localStorage.setItem("laporan",document.querySelector(".container").innerHTML);

alert("Data berhasil disimpan di browser.");

}

</script>

</body>
</html>
